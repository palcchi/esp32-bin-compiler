name: Build Custom ESP32 Code

on:
  push:
    branches: [main]
    paths:
      - 'custom_build/request.json'
      - '.github/workflows/custom-code.yml'
      - 'tools/prepare_custom.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare sketch
        run: |
          mkdir -p .build/custom
          python3 tools/prepare_custom.py

      - name: Cache Arduino core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init || true
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list | grep -q 'esp32:esp32.*3.3.11' || arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          while IFS= read -r lib; do
            [ -z "$lib" ] && continue
            arduino-cli lib install "$lib"
          done < .build/libs.txt

      - name: Compile
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p site/bins .build/custom/out .build/publish
          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --output-dir .build/custom/out .build/custom 2>&1 | tee .build/compile.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="custom-${SHORT_SHA}"
          BIN_NAME="${BUILD_ID}.bin"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DISPLAY_NAME="$(cat .build/name.txt)"
          OTA="$(cat .build/ota.txt 2>/dev/null || echo false)"

          if [ "$RC" -eq 0 ]; then
            APP_BIN="$(find .build/custom/out -maxdepth 1 -type f -name '*.ino.bin' | head -n 1)"
            cp "$APP_BIN" ".build/publish/$BIN_NAME"
            SIZE="$(wc -c < ".build/publish/$BIN_NAME" | tr -d ' ')"
            STATUS=ready
            FILE="bins/$BIN_NAME"
          else
            SIZE=0
            STATUS=failed
            FILE=''
          fi

          python3 - "$BUILD_ID" "$DISPLAY_NAME" "$FILE" "$SIZE" "$GITHUB_SHA" "$BUILT_AT" "$STATUS" "$OTA" <<'PY'
          import json, pathlib, sys
          build_id,name,file_name,size,commit,built_at,status,ota=sys.argv[1:]
          result={'id':build_id,'name':name,'file':file_name or None,'size':int(size),'commit':commit,'builtAt':built_at,'status':status,'board':'ESP32 DOIT DevKit V1','source':'Custom Code','ota':ota.strip().lower()=='true'}
          pathlib.Path('.build/publish/result.json').write_text(json.dumps(result,ensure_ascii=False))
          PY

      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name 'esp32-bin-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p site/bins
          if compgen -G '.build/publish/custom-*.bin' > /dev/null; then
            cp .build/publish/custom-*.bin site/bins/
          fi
          python3 <<'PY'
          import json, pathlib
          result=json.loads(pathlib.Path('.build/publish/result.json').read_text())
          p=pathlib.Path('site/builds.json')
          try: items=json.loads(p.read_text())
          except Exception: items=[]
          items=[x for x in items if x.get('id')!=result['id']]
          items.insert(0,result)
          p.write_text(json.dumps(items[:40],indent=2,ensure_ascii=False)+'\n')
          PY
          git add site/builds.json site/bins
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish custom ESP32 result [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOM-ESP32-COMPILE-LOG
          path: .build/compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload BIN
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOM-ESP32-BIN
          path: .build/publish/custom-*.bin
          retention-days: 30

      - name: Fail if compile failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
