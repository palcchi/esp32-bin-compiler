name: Build ESP32 BIN + Website Data

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python renderer
        run: python3 -m pip install pillow

      - name: Render lyrics to 128x64 frames
        shell: bash
        run: |
          python3 <<'PY'
          import json, pathlib, math
          from PIL import Image, ImageDraw, ImageFont
          cfg=json.loads(pathlib.Path('firmware/lyrics.json').read_text())
          scenes=cfg.get('scenes',[])[:120]
          style=cfg.get('style','brat')
          animation=cfg.get('animation','none')
          size=max(1,min(3,int(cfg.get('size',2))))
          candidates=['/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf','/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf']
          font_path=next((p for p in candidates if pathlib.Path(p).exists()),candidates[-1])
          def wrap(draw,text,font,maxw):
            words=text.split(); lines=[]; cur=''
            for word in words:
              test=(cur+' '+word).strip()
              if draw.textbbox((0,0),test,font=font)[2] <= maxw: cur=test
              else:
                if cur: lines.append(cur)
                cur=word
            if cur: lines.append(cur)
            return lines or ['']
          def scene_image(scene,progress=1.0):
            invert=bool(scene.get('invert',False)); bg=1 if invert else 0; fg=0 if invert else 1
            text=str(scene.get('text',''))
            if style=='brat': text=text.lower()
            base={1:15,2:20,3:24}[size] if style=='brat' else ({1:8,2:10,3:12}[size] if style=='tiny' else {1:11,2:14,3:18}[size])
            tmp=Image.new('1',(128,64),bg); d=ImageDraw.Draw(tmp)
            for fs in range(base,6,-1):
              font=ImageFont.truetype(font_path,fs); lines=wrap(d,text,font,120)
              lh=max(7,int(fs*(0.9 if style=='brat' else 1.05)))
              if len(lines)<=4 and len(lines)*lh<=58: break
            layer=Image.new('1',(128,64),0); draw=ImageDraw.Draw(layer)
            y=(64-len(lines)*lh)//2
            for line in lines[:4]:
              box=draw.textbbox((0,0),line,font=font); w=box[2]-box[0]
              draw.text(((128-w)//2,y),line,font=font,fill=1); y+=lh
            p=max(0,min(1,progress)); xoff=yoff=0; scale=1.0
            if animation=='pop':
              q=min(1,p/.35); c1=1.70158; q=1+(c1+1)*(q-1)**3+c1*(q-1)**2; scale=.35+.65*q
            elif animation=='slide':
              q=min(1,p/.30); q=1-(1-q)**3; yoff=round(22*(1-q))
            elif animation=='shake' and p<=.35:
              amp=5*(1-p/.35); xoff=round(math.sin(p*80)*amp); yoff=round(math.cos(p*55)*amp*.35)
            if scale!=1:
              nw=max(1,round(128*scale)); nh=max(1,round(64*scale)); layer=layer.resize((nw,nh),Image.Resampling.NEAREST)
              canvas=Image.new('1',(128,64),0); canvas.paste(layer,((128-nw)//2+xoff,(64-nh)//2+yoff)); layer=canvas
            elif xoff or yoff:
              canvas=Image.new('1',(128,64),0); canvas.paste(layer,(xoff,yoff)); layer=canvas
            if invert:
              out=Image.new('1',(128,64),1); out.paste(0,mask=layer); return out
            return layer
          def pack(im):
            px=im.load(); data=[]
            for page in range(8):
              for x in range(128):
                b=0
                for bit in range(8):
                  if px[x,page*8+bit]: b|=1<<bit
                data.append(b)
            return data
          frames=[]; durations=[]
          for s in scenes:
            total=max(50,int(s.get('duration',1500)))
            if animation=='none' or not str(s.get('text','')):
              frames.append(pack(scene_image(s,1))); durations.append(total); continue
            entrance=min(360,max(160,int(total*.35)))
            steps=4
            each=max(35,entrance//steps)
            for i in range(steps):
              frames.append(pack(scene_image(s,(i+1)/steps*.35))); durations.append(each)
            used=each*steps
            frames.append(pack(scene_image(s,1))); durations.append(max(50,total-used))
          if not frames: frames=[[0]*1024]; durations=[1000]
          out=['#pragma once','#include <Arduino.h>',f'#define LYRIC_FRAME_COUNT {len(frames)}']
          for i,data in enumerate(frames):
            out.append(f'const uint8_t lyric_frame_{i}[1024] PROGMEM = {{')
            for j in range(0,1024,32): out.append(','.join(f'0x{x:02x}' for x in data[j:j+32])+',')
            out.append('};')
          out.append('const uint8_t* const lyric_frames[] = {'+','.join(f'lyric_frame_{i}' for i in range(len(frames)))+'};')
          out.append('const uint32_t lyric_durations[] = {'+','.join(map(str,durations))+'};')
          pathlib.Path('firmware/LyricsFrames.h').write_text('\n'.join(out)+'\n')
          print(f'Rendered {len(frames)} OLED frames using animation={animation}')
          PY

      - name: Cache Arduino core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        shell: bash
        run: |
          arduino-cli config init || true
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list | grep -q 'esp32:esp32.*3.3.11' || arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile firmware and update manifest
        id: compile
        shell: bash
        run: |
          set -u
          mkdir -p site/bins .build
          FAILED=0
          SRC='firmware/firmware.ino'
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="lyrics-${SHORT_SHA}"
          BIN_NAME="${BUILD_ID}.bin"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DISPLAY_NAME='OLED Lyrics Build'
          SKETCH_DIR='.build/firmware'
          OUT_DIR="${SKETCH_DIR}/out"
          rm -rf "$SKETCH_DIR" && mkdir -p "$OUT_DIR"
          cp firmware/firmware.ino "${SKETCH_DIR}/firmware.ino"
          cp firmware/LyricsFrames.h "${SKETCH_DIR}/LyricsFrames.h"
          if arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --output-dir "$OUT_DIR" "$SKETCH_DIR"; then
            APP_BIN="$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.ino.bin' | head -n 1)"
            cp "$APP_BIN" "site/bins/$BIN_NAME"
            SIZE="$(wc -c < "site/bins/$BIN_NAME" | tr -d ' ')"
            STATUS='ready'; FILE="bins/$BIN_NAME"
          else
            SIZE=0; STATUS='failed'; FILE=''; FAILED=1
          fi
          python3 - "$BUILD_ID" "$DISPLAY_NAME" "$FILE" "$SIZE" "$GITHUB_SHA" "$BUILT_AT" "$STATUS" "$SRC" <<'PY'
          import json,pathlib,sys
          build_id,name,file_name,size,commit,built_at,status,source=sys.argv[1:]
          p=pathlib.Path('site/builds.json')
          try: items=json.loads(p.read_text())
          except: items=[]
          items=[x for x in items if x.get('id')!=build_id]
          items.insert(0,{'id':build_id,'name':name,'file':file_name or None,'size':int(size),'commit':commit,'builtAt':built_at,'status':status,'board':'ESP32 DOIT DevKit V1','source':source,'ota':True})
          items=items[:40]
          p.write_text(json.dumps(items,indent=2,ensure_ascii=False)+'\n')
          keep={x.get('file') for x in items if x.get('file')}
          for f in pathlib.Path('site/bins').glob('*.bin'):
            if f'bins/{f.name}' not in keep: f.unlink()
          PY
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Commit generated BIN history
        shell: bash
        run: |
          git config user.name 'esp32-bin-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/builds.json site/bins
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish OLED lyrics OTA binary [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload latest build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-OTA-BIN
          path: site/bins/*.bin
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if compiler failed
        if: steps.compile.outputs.failed == '1'
        run: exit 1
