name: Build ESP32 BIN + Website Data

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python renderer
        run: python3 -m pip install pillow

      - name: Render lyrics to 128x64 frames
        shell: bash
        run: |
          python3 <<'PY'
          import json, pathlib, math
          from PIL import Image, ImageDraw, ImageFont
          cfg=json.loads(pathlib.Path('firmware/lyrics.json').read_text())
          scenes=cfg.get('scenes',[])[:120]
          style=cfg.get('style','brat')
          size=max(1,min(3,int(cfg.get('size',2))))
          allowed={'none','slide','slidewords','words','popwords'}
          candidates=['/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf','/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf']
          font_path=next((p for p in candidates if pathlib.Path(p).exists()),candidates[-1])
          def fit_layout(text):
            brat=style=='brat'
            if brat: text=text.lower()
            base={1:15,2:20,3:24}[size] if brat else ({1:8,2:10,3:12}[size] if style=='tiny' else {1:11,2:14,3:18}[size])
            probe=Image.new('1',(128,64),0); d=ImageDraw.Draw(probe)
            max_lines=5 if style=='tiny' else 4
            max_width=112 if brat else 120
            for fs in range(base,6,-1):
              font=ImageFont.truetype(font_path,fs); words=text.split(); lines=[]; cur=''
              for word in words:
                test=(cur+' '+word).strip()
                if d.textbbox((0,0),test,font=font)[2] <= max_width: cur=test
                else:
                  if cur: lines.append(cur)
                  cur=word
              if cur: lines.append(cur)
              if not lines: lines=['']
              lh=max(7,int(fs*(0.9 if brat else 1.05)))
              if len(lines)<=max_lines and len(lines)*lh<=58: break
            lines=lines[:max_lines]; rows=[]
            for line in lines:
              ws=line.split(); widths=[d.textbbox((0,0),w,font=font)[2] for w in ws]; space=max(1,d.textbbox((0,0),' ',font=font)[2]); total=sum(widths)+space*max(0,len(ws)-1); rows.append((ws,widths,space,total))
            widest=max(1,max((r[3] for r in rows),default=1)); block_width=min(112,max(54,widest)) if brat else widest; items=[]; y=(64-len(rows)*lh)//2
            for ws,widths,space,total in rows:
              if brat and len(ws)>1: gap=(block_width-sum(widths))/(len(ws)-1); x=(128-block_width)/2
              else: gap=space; x=(128-total)/2
              for word,w in zip(ws,widths): items.append((word,x+w/2,y,w)); x+=w+gap
              y+=lh
            return font,items,lh
          def draw_word(im,font,item,fg,yoff=0,scale=1.0):
            word,cx,y,w=item
            if scale==1.0:
              d=ImageDraw.Draw(im); box=d.textbbox((0,0),word,font=font); tw=box[2]-box[0]; d.text((round(cx-tw/2),round(y+yoff)),word,font=font,fill=fg); return
            mask=Image.new('L',(128,64),0); md=ImageDraw.Draw(mask); box=md.textbbox((0,0),word,font=font); tw=box[2]-box[0]; th=max(1,box[3]-box[1]); md.text((round(cx-tw/2),round(y)),word,font=font,fill=255)
            crop=mask.crop(mask.getbbox() or (0,0,1,1)); nw=max(1,round(crop.width*scale)); nh=max(1,round(crop.height*scale)); crop=crop.resize((nw,nh),Image.Resampling.NEAREST); px=round(cx-nw/2); py=round(y+(th-nh)/2); fill=Image.new('1',(nw,nh),fg); im.paste(fill,(px,py),crop)
          def render(scene,mode='none',visible=None,active_progress=1.0,whole_progress=1.0):
            invert=bool(scene.get('invert',False)); bg=1 if invert else 0; fg=0 if invert else 1; im=Image.new('1',(128,64),bg); text=str(scene.get('text',''))
            if not text: return im
            if mode in {'words','slidewords','popwords'}:
              all_words=text.split(); n=len(all_words); visible=n if visible is None else max(0,min(n,visible)); count=min(n,visible+(1 if visible<n and active_progress>0 else 0)); partial=' '.join(all_words[:count])
              if not partial:return im
              font,items,_=fit_layout(partial)
              for i,item in enumerate(items):
                is_active=(i==len(items)-1 and visible<n and active_progress>0)
                if not is_active: draw_word(im,font,item,fg); continue
                p=max(0,min(1,active_progress))
                if mode=='slidewords': q=1-(1-p)**3; draw_word(im,font,item,fg,yoff=round(18*(1-q)))
                elif mode=='popwords': c1=1.70158; q=1+(c1+1)*(p-1)**3+c1*(p-1)**2; draw_word(im,font,item,fg,scale=max(.2,.22+.78*q))
                else: draw_word(im,font,item,fg)
              return im
            font,items,_=fit_layout(text)
            if mode=='slide':
              p=max(0,min(1,whole_progress)); q=1-(1-p)**3; off=round(22*(1-q))
              for item in items: draw_word(im,font,item,fg,yoff=off)
              return im
            for item in items: draw_word(im,font,item,fg)
            return im
          def pack(im):
            px=im.load(); data=[]
            for page in range(8):
              for x in range(128):
                b=0
                for bit in range(8):
                  if px[x,page*8+bit]: b|=1<<bit
                data.append(b)
            return data
          frames=[]; durations=[]
          for s in scenes:
            total=max(50,int(s.get('duration',1500))); mode=s.get('animation','none')
            if mode not in allowed: mode='none'
            text=str(s.get('text','')).strip(); words=text.split()
            if not text or mode=='none': frames.append(pack(render(s))); durations.append(total); continue
            if mode=='slide':
              entrance=min(360,max(160,int(total*.35))); steps=4; each=max(35,entrance//steps)
              for p in (.18,.42,.72,1.0): frames.append(pack(render(s,'slide',whole_progress=p))); durations.append(each)
              frames.append(pack(render(s))); durations.append(max(50,total-each*steps)); continue
            n=len(words)
            if mode=='words':
              step=max(50,min(260,int(total*.72/max(1,n))))
              for i in range(n): frames.append(pack(render(s,'words',visible=i,active_progress=1))); durations.append(step)
              frames.append(pack(render(s))); durations.append(max(50,total-step*n)); continue
            step=max(35,min(150,int(total*.72/max(1,n*2))))
            for i in range(n): frames.append(pack(render(s,mode,visible=i,active_progress=.42))); durations.append(step); frames.append(pack(render(s,mode,visible=i,active_progress=1.0))); durations.append(step)
            frames.append(pack(render(s))); durations.append(max(50,total-step*n*2))
          if not frames: frames=[[0]*1024]; durations=[1000]
          if len(frames)>240: raise SystemExit(f'Too many generated frames: {len(frames)} > 240')
          out=['#pragma once','#include <Arduino.h>',f'#define LYRIC_FRAME_COUNT {len(frames)}']
          for i,data in enumerate(frames):
            out.append(f'const uint8_t lyric_frame_{i}[1024] PROGMEM = {{')
            for j in range(0,1024,32): out.append(','.join(f'0x{x:02x}' for x in data[j:j+32])+',')
            out.append('};')
          out.append('const uint8_t* const lyric_frames[] = {'+','.join(f'lyric_frame_{i}' for i in range(len(frames)))+'};'); out.append('const uint32_t lyric_durations[] = {'+','.join(map(str,durations))+'};'); pathlib.Path('firmware/LyricsFrames.h').write_text('\n'.join(out)+'\n')
          print(f'Rendered {len(frames)} OLED frames with justified BRAT blocks')
          PY

      - name: Cache Arduino core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        shell: bash
        run: |
          arduino-cli config init || true
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list | grep -q 'esp32:esp32.*3.3.11' || arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile firmware and update manifest
        id: compile
        shell: bash
        run: |
          set -u
          mkdir -p site/bins .build
          FAILED=0
          SRC='firmware/firmware.ino'
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="lyrics-${SHORT_SHA}"
          BIN_NAME="${BUILD_ID}.bin"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DISPLAY_NAME="$(python3 -c "import json; print(json.load(open('firmware/lyrics.json')).get('name','OLED Lyrics Build'))")"
          SKETCH_DIR='.build/firmware'
          OUT_DIR="${SKETCH_DIR}/out"
          rm -rf "$SKETCH_DIR" && mkdir -p "$OUT_DIR"
          cp firmware/firmware.ino "${SKETCH_DIR}/firmware.ino"
          cp firmware/LyricsFrames.h "${SKETCH_DIR}/LyricsFrames.h"
          if arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --output-dir "$OUT_DIR" "$SKETCH_DIR"; then
            APP_BIN="$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.ino.bin' | head -n 1)"
            cp "$APP_BIN" "site/bins/$BIN_NAME"
            SIZE="$(wc -c < "site/bins/$BIN_NAME" | tr -d ' ')"
            STATUS='ready'; FILE="bins/$BIN_NAME"
          else
            SIZE=0; STATUS='failed'; FILE=''; FAILED=1
          fi
          python3 - "$BUILD_ID" "$DISPLAY_NAME" "$FILE" "$SIZE" "$GITHUB_SHA" "$BUILT_AT" "$STATUS" "$SRC" <<'PY'
          import json,pathlib,sys
          build_id,name,file_name,size,commit,built_at,status,source=sys.argv[1:]
          p=pathlib.Path('site/builds.json')
          try: items=json.loads(p.read_text())
          except: items=[]
          items=[x for x in items if x.get('id')!=build_id]
          items.insert(0,{'id':build_id,'name':name,'file':file_name or None,'size':int(size),'commit':commit,'builtAt':built_at,'status':status,'board':'ESP32 DOIT DevKit V1','source':source,'ota':True})
          items=items[:40]
          p.write_text(json.dumps(items,indent=2,ensure_ascii=False)+'\n')
          keep={x.get('file') for x in items if x.get('file')}
          for f in pathlib.Path('site/bins').glob('*.bin'):
            if f'bins/{f.name}' not in keep: f.unlink()
          PY
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Commit generated BIN history
        shell: bash
        run: |
          git config user.name 'esp32-bin-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/builds.json site/bins
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish OLED lyrics OTA binary [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload latest build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-OTA-BIN
          path: site/bins/*.bin
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if compiler failed
        if: steps.compile.outputs.failed == '1'
        run: exit 1
