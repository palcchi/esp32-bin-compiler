<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLED Editor</title><link rel="stylesheet" href="/styles.css?v=9"><link rel="stylesheet" href="/gameboy.css?v=1"></head><body><main class="shell"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">V</span><span><small>VALLIAN LAB</small><strong>OLED Editor</strong></span></a><span class="tool-badge">128×64</span></header><nav class="main-menu"><a href="/">Home</a><a href="/projects">Projects</a><a class="active" href="/editor">Editor</a><a href="/lyrics">Lyrics</a><a href="/image">Image</a><a href="/draw">Draw</a><a href="/video">Video</a><a href="/code">Code</a><a href="/builds">Builds</a><a href="/devices">Devices</a></nav><div class="gameboy-strip"><i></i><i></i><i></i><i></i></div><header class="page-head"><p class="eyebrow">SCENE MIXER</p><h1 class="pixel-title">OLED EDITOR</h1></header><section class="lyrics-workspace"><div class="card lyric-editor"><div class="editor-title"><div><h2>Timeline</h2><p>Text, image dan drawing bisa hidup dalam satu project.</p></div><span id="sizeMeter" class="tool-badge">0 KB</span></div><div class="studio-actions"><button class="button secondary" id="addText">+ TEXT</button><button class="button secondary" id="addImage">+ IMAGE</button><button class="button secondary" id="addPause">+ PAUSE</button></div><div id="timeline" class="scene-list" style="margin-top:14px"></div><div class="control-row" style="margin-top:16px"><label>Transition<select id="transition"><option>None</option><option>Slide Left</option><option>Slide Up</option><option>Wipe</option><option>Dither Fade</option><option>Pixel Dissolve</option></select></label><label>Duration<input id="duration" type="number" value="1.5" min=".1" step=".1"></label></div><div class="studio-actions" style="margin-top:14px"><button class="button download" id="saveProject">SAVE PROJECT</button><a class="button ghost" href="/lyrics">OPEN LYRICS TOOL</a></div></div><aside class="preview-column"><div class="device-stage"><div class="oled-device"><div class="oled-board"><div class="oled-glass"><canvas id="editorOled" width="128" height="64"></canvas></div></div></div></div><div class="preview-info"><strong>LIVE PREVIEW</strong><span id="frameInfo">Scene 0</span></div><section class="card" style="padding:16px;margin-top:12px"><p class="eyebrow">MUSIC SYNC</p><input id="audio" type="file" accept="audio/*"><audio id="player" controls style="width:100%;margin-top:10px"></audio><button id="markBeat" class="button secondary" style="margin-top:10px">MARK CURRENT TIME</button><p class="muted small" id="beatInfo">Upload audio untuk timing reference. Audio tidak masuk firmware.</p></section></aside></section></main><script src="/editor.js"></script></body></html>
