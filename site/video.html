<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Video · OLED Studio</title><link rel="stylesheet" href="/styles.css?v=10"><link rel="stylesheet" href="/sticky-actions.css?v=2"></head><body><main class="shell"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">V</span><span><small>VALLIAN LAB</small><strong>Video</strong></span></a><span class="tool-badge">FRAME</span></header><nav class="main-menu"></nav><header class="page-head"><p class="eyebrow">VIDEO → OLED</p><h1>Video</h1></header><section class="studio card"><div class="upload-zone"><input id="videoInput" type="file" accept="video/*" hidden><button id="pickVideo" class="button secondary">Choose video</button><p id="videoName" class="muted small">MP4 / MOV</p></div><div class="oled-wrap"><canvas id="oled" width="128" height="64"></canvas><div class="oled-label">128×64 · 1-BIT</div></div><video id="sourceVideo" playsinline muted hidden></video><canvas id="work" width="128" height="64" hidden></canvas><div class="controls"><label>FPS<select id="fps"><option>8</option><option selected>12</option><option>15</option><option>20</option><option>24</option></select></label><label>Threshold<input id="threshold" type="range" min="30" max="225" value="128"><span id="thresholdValue">128</span></label><label class="check"><input id="invert" type="checkbox"> Invert</label></div><div class="studio-actions"><button id="previewButton" class="button secondary" disabled>Preview</button><button id="exportButton" class="button secondary" disabled>Export .h</button><button id="buildVideoBin" class="button download" disabled>Build .BIN</button></div><p id="stats" class="muted small">No video.</p></section></main><script src="/video.js"></script><script src="/universal-build.js?v=1"></script><script>document.getElementById('videoInput')?.addEventListener('change
